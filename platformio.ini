; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Switch Arduino_Uno and megaatmega2560 to switch between the two boards
; Switch Arduino_Uno and Arduino_Uno_Test to switch between main and test file
[platformio]
default_envs = Arduino_Uno
src_dir = .

[env]
build_src_filter = -<*> +<src/>

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

[env:megaatmega2560_Test]
extends = env:megaatmega2560
build_src_filter = -<*> +<test/test.cpp>

[env:Arduino_Uno]
platform = atmelavr
board = uno
framework = arduino

[env:Arduino_Uno_Test]
extends = env:Arduino_Uno
build_src_filter = -<*> +<test/test.cpp>